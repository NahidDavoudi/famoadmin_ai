name: CI/CD - Test, Build & Push Docker Image

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  VITE_API_BASE: ${{ vars.VITE_API_BASE || 'https://api.famoacademy.ir/api/v1' }}
  VITE_MAIN_SITE_URL: ${{ vars.VITE_MAIN_SITE_URL || 'https://famoacademy.ir' }}
  VITE_AUTH_URL: ${{ vars.VITE_AUTH_URL || 'https://auth.famoacademy.ir' }}

jobs:
  test-and-verify:
    name: Lint, Unit Tests & Vite Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check (Lint)
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Verify production bundle build
        run: npm run build

  build-and-push:
    name: Build & Push Docker Image (:latest)
    needs: test-and-verify
    runs-on: ubuntu-latest
    env:
      # secrets are not available in step-level `if`, so expose them via env
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize image name to lowercase
        id: meta_vars
        run: |
          IMAGE_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "ghcr_image=${{ env.REGISTRY }}/${IMAGE_LC}" >> "$GITHUB_OUTPUT"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (ghcr.io)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (optional)
        if: github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Assemble Docker tags
        id: tags
        run: |
          TAGS="${{ steps.meta_vars.outputs.ghcr_image }}:latest,${{ steps.meta_vars.outputs.ghcr_image }}:sha-${{ steps.meta_vars.outputs.short_sha }}"
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            DH_USER_LC=$(echo "$DOCKERHUB_USERNAME" | tr '[:upper:]' '[:lower:]')
            TAGS="${TAGS},${DH_USER_LC}/famo-admin-panel:latest,${DH_USER_LC}/famo-admin-panel:sha-${{ steps.meta_vars.outputs.short_sha }}"
          fi
          echo "list=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.list }}
          build-args: |
            VITE_API_BASE=${{ env.VITE_API_BASE }}
            VITE_MAIN_SITE_URL=${{ env.VITE_MAIN_SITE_URL }}
            VITE_AUTH_URL=${{ env.VITE_AUTH_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
