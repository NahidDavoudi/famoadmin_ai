services:
  famo-admin:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-https://api.famoacademy.ir/api/v1}
        VITE_MAIN_SITE_URL: ${VITE_MAIN_SITE_URL:-https://famoacademy.ir}
    container_name: famo-admin-panel
    ports:
      - "${PORT:-3000}:80"
    restart: unless-stopped
