services:
  famo-admin:
    image: ${FAMO_ADMIN_IMAGE:-ghcr.io/nahiddavoudi/famoadmin_ai:latest}
    container_name: famo-admin-test
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    env_file: ./.env
    networks: [proxy]

networks:
  proxy:
    external: true
  db_net:
    external: true
