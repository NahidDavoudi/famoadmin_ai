services:
  famo-admin:
    # آدرس ایمیج ساخته شده در GitHub Container Registry (یا Docker Hub) با تگ latest
    # مقدار OWNER/REPO را با نام اکانت و ریپازیتوری گیت‌هاب خود جایگزین کنید (با حروف کوچک)
    image: ${FAMO_ADMIN_IMAGE:-ghcr.io/owner/famoadmin_ai:latest}
    container_name: famo-admin-panel
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
