    TelegramVerifyLinked:
      type: object
      properties:
        linked:
          type: boolean
          enum: [true]
        bot_redirect_url:
          type: string
          nullable: true
          description: >
            `TELEGRAM_BOT_URL` + `?start=linked` (null when the env var is unset;
            the page then falls back to the role panel).
      required: [linked, bot_redirect_url]

    TelegramRegisterRequest:
      type: object
      properties:
        ticket:
          type: string
          description: Ticket issued by /auth/telegram/verify
        phone:
          type: string
        password:
          type: string
          format: password
          minLength: 4
        nationalId:
          type: string
        grade:
          type: integer
          enum: [7, 8, 9, 10, 11, 12]
        field:
          type: string
          enum: [ریاضی, تجربی, انسانی, زبان, هنر, عمومی, راهنمایی]
        name:
          type: string
      required: [ticket, phone, password, nationalId, grade, field, name]

    TelegramLinkRequest:
      type: object
      properties:
        ticket:
          type: string
          description: Ticket issued by /auth/telegram/verify
        username:
          type: string
        password:
          type: string
          format: password
      required: [ticket, username, password]

    TelegramVerify2faRequest:
      type: object
      properties:
        ticket:
          type: string
        challenge_id:
          type: string
          description: Server-bound 2FA challenge nonce returned by /auth/telegram/link
        code:
          type: string
        user_id:
          type: integer
          description: >
            Not accepted as authority; if sent it must match the server-bound
            challenge user or the request is rejected.
      required: [ticket, challenge_id, code]

    TelegramLinkUser:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        role:
          type: string
          enum: [student, supporter]
        student_id:
          type: integer
          nullable: true
          description: شناسه دانش‌آموز متصل (فقط برای نقش student)

    TelegramLinkResult:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/TelegramLinkUser"
        bot_redirect_url:
          type: string
          nullable: true
      required: [token, user, bot_redirect_url]

    Telegram2faChallenge:
      type: object
      properties:
        requires_2fa:
          type: boolean
          enum: [true]
        challenge_id:
          type: string
          description: Server-bound challenge nonce (no `user_id` is exposed)
        phone_mask:
          type: string
          description: Masked destination phone, e.g. 0912***89
      required: [requires_2fa, challenge_id, phone_mask]

    AuthUserProfile:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        phone:
          type: string
          nullable: true
        role:
          type: string
          enum: [admin, supporter, student, teacher]
        full_name:
          type: string
          nullable: true
        student_id:
          type: integer
          nullable: true
          description: شناسه دانش‌آموز متصل (فقط برای نقش student)
        instructor_id:
          type: integer
          nullable: true
          description: شناسه مدرس متصل (فقط برای نقش teacher)
      required: [id, username, role]

    AuthChangePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
          format: password
          description: رمز عبور فعلی کاربر
        new_password:
          type: string
          format: password
          minLength: 4
          description: رمز عبور جدید (حداقل ۴ کاراکتر)
      required: [current_password, new_password]

    AuthProfileUpdateRequest:
      type: object
      properties:
        full_name:
          type: string
          minLength: 2
          maxLength: 150
          description: نام و نام خانوادگی (کلید `name` نیز پذیرفته می‌شود)
        name:
          type: string
          minLength: 2
          maxLength: 150
          description: نام جایگزین برای `full_name`
        phone:
          type: string
          description: شماره تلفن همراه ایرانی (نرمال‌سازی شده به 09XXXXXXXXX)
        current_password:
          type: string
          format: password
          description: رمز عبور فعلی (الزامی هنگام تغییر شماره تلفن برای نقش‌های دارای 2FA یعنی admin/supporter/teacher)
      required: [phone]

    ExamComment:
      type: object
      properties:
        id:
          type: integer
        student_id:
          type: integer
        exam_date:
          type: string
          format: date
        teacher_user_id:
          type: integer
        author_name:
          type: string
          description: نام نویسنده نظر (استاد، پشتیبان یا ادمین)
        author_role:
          type: string
          enum: [teacher, supporter, admin]
        body:
          type: string
          description: متن نظر ثبت‌شده روی نتیجه آزمون
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, student_id, exam_date, teacher_user_id, body, created_at, updated_at]

    ExamCommentUpsertRequest:
      type: object
      properties:
        student_id:
          type: integer
          minimum: 1
          description: شناسه دانش‌آموز
        exam_date:
          type: string
          format: date
          description: تاریخ آزمون (YYYY-MM-DD)
        body:
          type: string
          minLength: 1
          maxLength: 2000
          description: متن نظر استاد یا پشتیبان
      required: [student_id, exam_date, body]

    ExamShareLinkCreateRequest:
      type: object
      properties:
        student_id:
          type: integer
          minimum: 1
          description: شناسه دانش‌آموز
        exam_date:
          type: string
          format: date
          description: تاریخ آزمون (YYYY-MM-DD)
        send_sms:
          type: boolean
          default: false
          description: در صورت true بودن، لینک کارنامه از طریق ملی‌پیامک برای والد ارسال می‌شود
        parent_contact_id:
          type: integer
          nullable: true
          description: شناسه مخاطب والد در parent_contacts (در صورت عدم ارسال، والد اصلی انتخاب می‌شود)
        phone:
          type: string
          nullable: true
          description: شماره تلفن همراه والد (اختیاری؛ نرمال‌سازی شده با PhoneNumber::normalizeOrFail)
      required: [student_id, exam_date]

    ExamShareLinkResponse:
      type: object
      properties:
        id:
          type: integer
        token:
          type: string
          description: توکن base64url تولیدشده با random_bytes(32)
        url:
          type: string
          description: آدرس عمومی مشاهده کارنامه
        share_path:
          type: string
          description: مسیر نسبی مشاهده عمومی کارنامه
        share_url:
          type: string
          description: آدرس عمومی مشاهده کارنامه
        student_id:
          type: integer
        exam_date:
          type: string
          format: date
        expires_at:
          type: string
          format: date-time
          description: تاریخ انقضای لینک (۱۴ روز پس از صدور)
        sms_sent:
          type: boolean
          description: وضعیت ارسال پیامک به والد
        sms_sent_at:
          type: string
          format: date-time
          nullable: true
          description: زمان ارسال پیامک از طریق ملی‌پیامک
        recipient_phone_mask:
          type: string
          nullable: true
          description: شماره ماسک‌شده والد گیرنده پیامک (مثلاً 0912***89)
      required: [id, token, url, share_url, student_id, exam_date, expires_at]

    ExamShareLinkItem:
      type: object
      description: اطلاعات مدیریتی لینک اشتراک کارنامه در پنل (بدون token_hash)
      properties:
        id:
          type: integer
        student_id:
          type: integer
        student_name:
          type: string
        exam_date:
          type: string
          format: date
        status:
          type: string
          enum: [active, expired, revoked]
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          nullable: true
        sms_sent_at:
          type: string
          format: date-time
          nullable: true
        last_viewed_at:
          type: string
          format: date-time
          nullable: true
        created_by:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
      required: [id, student_id, exam_date, status, expires_at]

    PublicSharedExamResult:
      type: object
      description: خروجی عمومی کارنامه برای والدین (بدون کد ملی و بدون شماره تلفن)
      properties:
        student_name:
          type: string
        student:
          type: object
          properties:
            name:
              type: string
            grade:
              type: integer
              nullable: true
            field:
              type: string
              nullable: true
          required: [name]
        exam_date:
          type: string
          format: date
        subjects:
          type: array
          items:
            type: object
            properties:
              subject:
                type: string
              chapter:
                type: string
                nullable: true
              total_q:
                type: integer
              correct:
                type: integer
              wrong:
                type: integer
              skipped:
                type: integer
              percentage:
                type: number
        avg_percentage:
          type: number
        comments:
          type: array
          items:
            type: object
            properties:
              author_name:
                type: string
              author_role:
                type: string
                enum: [teacher, supporter, admin]
              body:
                type: string
              created_at:
                type: string
                format: date-time
              updated_at:
                type: string
                format: date-time
      required: [student_name, student, exam_date, subjects, avg_percentage, comments]

    AppointmentSmsPreviewItem:
      type: object
      properties:
        student_id:
          type: integer
        student_name:
          type: string
        grade:
          type: integer
          nullable: true
        field:
          type: string
          nullable: true
        status:
          type: string
          enum: [will_send, already_sent, changed_since_sent, failed, no_phone, no_appointment]
        recipient_type:
          type: string
          enum: [parent]
        parent_name:
          type: string
          nullable: true
        mobile_mask:
          type: string
          nullable: true
        appointment_id:
          type: integer
          nullable: true
        appointment_date:
          type: string
          format: date
          nullable: true
        appointment_jalali:
          type: string
          nullable: true
        weekday:
          type: string
          nullable: true
        start_time:
          type: string
          nullable: true
        end_time:
          type: string
          nullable: true
        appointment_status:
          type: string
          nullable: true
        appointment_at:
          type: string
          nullable: true
          description: Snapshot of appointment_date + start_time (YYYY-MM-DD HH:MM:SS)
        multiple_appointments:
          type: boolean
          description: True when the student has more than one active appointment in the week
        active_appointments_count:
          type: integer
        last_sent_at:
          type: string
          format: date-time
          nullable: true
        last_appointment_at:
          type: string
          nullable: true
        attempts:
          type: integer
        last_error:
          type: string
          nullable: true
      required: [student_id, student_name, status, multiple_appointments]

    AppointmentSmsPreviewResponse:
      type: object
      properties:
        week_date:
          type: string
          format: date
          description: Normalized Saturday week start (IranDay::weekStart)
        week_end:
          type: string
          format: date
          description: Friday week end
        summary:
          type: object
          properties:
            total:
              type: integer
            will_send:
              type: integer
            already_sent:
              type: integer
            changed_since_sent:
              type: integer
            failed:
              type: integer
            no_phone:
              type: integer
            no_appointment:
              type: integer
            multiple_appointments:
              type: integer
          required: [total, will_send, already_sent, changed_since_sent, failed, no_phone, no_appointment]
        items:
          type: array
          items:
            $ref: "#/components/schemas/AppointmentSmsPreviewItem"
        students:
          type: array
          items:
            $ref: "#/components/schemas/AppointmentSmsPreviewItem"
      required: [week_date, week_end, summary, items]

    AppointmentSmsSendRequest:
      type: object
      properties:
        week_date:
          type: string
          format: date
          description: Target week date (normalized to Saturday via IranDay::weekStart)
        mode:
          type: string
          enum: [unsent, failed, changed]
          default: unsent
          description: |
            - `unsent`: Send only to students with an active appointment who have not yet been sent an SMS for this week.
            - `failed`: Retry only students whose last SMS attempt for this week failed.
            - `changed`: Send updated appointment time only to students whose `appointment_at` changed after `status=sent`.
        student_ids:
          type: array
          nullable: true
          items:
            type: integer
            minimum: 1
          description: Optional subset of student IDs to process; omit to process all eligible students
        operation_id:
          type: string
          nullable: true
          description: Optional client operation/idempotency token to guard against double-click submissions
      required: [week_date, mode]

    AppointmentSmsSendResponse:
      type: object
      properties:
        week_date:
          type: string
          format: date
        week_end:
          type: string
          format: date
        mode:
          type: string
          enum: [unsent, failed, changed]
        sent:
          type: integer
        failed:
          type: integer
        skipped:
          type: integer
        skipped_no_phone:
          type: integer
        summary:
          type: object
          properties:
            sent:
              type: integer
            failed:
              type: integer
            skipped:
              type: integer
            skipped_no_phone:
              type: integer
            already_sent:
              type: integer
            no_appointment:
              type: integer
        items:
          type: array
          items:
            type: object
            properties:
              student_id:
                type: integer
              student_name:
                type: string
              recipient_type:
                type: string
                enum: [parent]
              mobile_mask:
                type: string
                nullable: true
              appointment_at:
                type: string
                nullable: true
              multiple_appointments:
                type: boolean
              status:
                type: string
                enum: [sent, failed, skipped_no_phone, already_sent, changed_since_sent, no_appointment, skipped]
              error:
                type: string
                nullable: true
      required: [week_date, mode, sent, failed, skipped, items]

    AppointmentSmsLogItem:
      type: object
      properties:
        id:
          type: integer
        student_id:
          type: integer
        student_name:
          type: string
        grade:
          type: integer
          nullable: true
        field:
          type: string
          nullable: true
        week_date:
          type: string
          format: date
        mobile_mask:
          type: string
          nullable: true
        recipient_type:
          type: string
          enum: [parent, student]
        appointment_at:
          type: string
          nullable: true
        status:
          type: string
          enum: [sent, failed, skipped_no_phone]
        error:
          type: string
          nullable: true
        attempts:
          type: integer
        sent_at:
          type: string
          format: date-time
          nullable: true
        created_by:
          type: integer
          nullable: true
        created_by_username:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, student_id, week_date, recipient_type, status, attempts]

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            data: null
            pagination: null
            error:
              code: VALIDATION_ERROR
              message: پارامترها ناقص است
    Unauthorized:
      description: Authentication required or token invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            data: null
            pagination: null
            error:
              code: AUTH_ERROR
              message: توکن نامعتبر است
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            data: null
            pagination: null
            error:
              code: FORBIDDEN
              message: دسترسی غیرمجاز
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            data: null
            pagination: null
            error:
              code: NOT_FOUND
              message: مورد نظر یافت نشد
    Conflict:
      description: Resource conflict (e.g. duplicate)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            data: null
            pagination: null
            error:
              code: REGISTRATION_ERROR
              message: کاربر قبلاً ثبت‌نام کرده است
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            data: null
            pagination: null
            error:
              code: VALIDATION_ERROR
              message: نام دانش‌آموز الزامی است
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            data: null
            pagination: null
            error:
              code: INTERNAL_ERROR
              message: خطای داخلی سرور
    BotUnauthorized:
      description: Missing or invalid bot service key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            data: null
            pagination: null
            error:
              code: BOT_UNAUTHORIZED
              message: کلید سرویس ربات نامعتبر است
    BotForbidden:
      description: Bot IP not allowed, or acting account blocked/inactive
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            data: null
            pagination: null
            error:
              code: BOT_ACCOUNT_BLOCKED
              message: کاربر ربات را مسدود کرده است
    ContentAccessDisabled:
      description: Content-reading permission is off for this admin
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            data: null
            pagination: null
            error:
              code: CONTENT_ACCESS_DISABLED
              message: دسترسی به محتوای پیام‌ها فعال نیست
    RateLimited:
      description: Throttled; retry after the indicated delay
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until the next allowed attempt
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            data: null
            pagination: null
            error:
              code: RATE_LIMITED
              message: تعداد درخواست‌ها بیش از حد مجاز است
    TelegramAuthInvalid:
      description: Widget hash invalid, or auth_date stale
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            data: null
            pagination: null
            error:
              code: TELEGRAM_AUTH_INVALID
              message: اطلاعات ورود تلگرام نامعتبر است
    TelegramReplay:
      description: Verified Telegram widget payload already consumed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            data: null
            pagination: null
            error:
              code: TELEGRAM_REPLAY
              message: این ورود قبلاً استفاده شده است
    TelegramTicketInvalid:
      description: Ticket signature/audience/purpose/TTL/consumption failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            data: null
            pagination: null
            error:
              code: TELEGRAM_TICKET_INVALID
              message: بلیت ورود تلگرام نامعتبر یا منقضی شده است
    TelegramLinkRoleUnsupported:
      description: Role is not student/supporter
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            data: null
            pagination: null
            error:
              code: TELEGRAM_LINK_ROLE_UNSUPPORTED
              message: این نقش برای اتصال به تلگرام پشتیبانی نمی‌شود

tags:
  - name: Health
    description: Health check endpoints
  - name: Auth
    description: Authentication & authorization
  - name: Dashboard
    description: Dashboard statistics (supporter+)
  - name: Public
    description: Public (no auth required) endpoints
  - name: Blog
    description: Blog post management
  - name: Students
    description: Student management
  - name: Analytics
    description: Student analytics
  - name: Courses
    description: Course management
  - name: Subscriptions
    description: Course subscription management (student & supporter/admin)
  - name: Instructors
    description: Instructor management
  - name: Supporters
    description: Supporter management
  - name: Exams
    description: Exam results
  - name: WeeklyPlans
    description: Weekly study plans & templates
  - name: Reports
    description: Reports (supporter role)
  - name: Files
    description: File uploads for students
  - name: Topics
    description: Topic tree (subjects, chapters, topics)
  - name: Appointments
    description: Appointment scheduling (supporter role)
  - name: DailyAttendance
    description: Daily attendance board (admin & supporter)
  - name: Tutoring
    description: Tutoring classroom, teacher status & sessions
  - name: Assignments
    description: Canonical student → supporter assignments (admin)
  - name: AdminStats
    description: Admin statistics & reporting (admin)
  - name: Bot
    description: Telegram bot gateway (service key)
  - name: BotIdentity
    description: Telegram identity & linking (service key)
  - name: Threads
    description: Daily report threads & messages (service key)
  - name: SupporterInbox
    description: Supporter inbox, student list & replies (service key)
  - name: Broadcasts
    description: Supporter broadcasts (service key)
  - name: Outbox
    description: Telegram outbox pull/report protocol (service key)
