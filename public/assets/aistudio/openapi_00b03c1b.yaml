  /api/v1/public/blog/posts/{slug}:
    get:
      tags: [Public, Blog]
      summary: Get single published post by slug
      description: |
        Fetches a single published blog post by its URL slug and increments its view counter.
        - **Input Requirements**:
          - `slug` (required path string): Non-empty URL slug string (`1..255` characters).
        - **Caching**: Post data is cached in Redis under group `public` (`blog_post:{slug}`, 600s TTL) while live view counts are atomically incremented via Redis (`blog_post_views:{id}`) and persisted to the database.
        - **Rate Limiting**: Enforced per client IP via `RateLimitMiddleware('public:ip')`.
      operationId: publicGetBlogPostBySlug
      parameters:
        - $ref: "#/components/parameters/PublicBlogSlug"
      responses:
        "200":
          description: Post found
          headers:
            Cache-Control:
              $ref: "#/components/headers/PublicCacheControlHeader"
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimitHeader"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemainingHeader"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          post:
                            $ref: "#/components/schemas/BlogPost"
                        required: [post]
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/public/blog/categories:
    get:
      tags: [Public, Blog]
      summary: Get active blog categories
      description: |
        Returns all active blog categories with their published post counts.
        - **Input Requirements**: None (no query, path, or body parameters required).
        - **Caching**: Cached in Redis under group `public` (`blog_category`, 600s TTL; HTTP response cached 300s).
        - **Rate Limiting**: Enforced per client IP via `RateLimitMiddleware('public:ip')`.
      operationId: publicGetBlogCategories
      responses:
        "200":
          description: List of categories
          headers:
            X-Cache:
              $ref: "#/components/headers/XCacheHeader"
            Cache-Control:
              $ref: "#/components/headers/PublicCacheControlHeader"
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimitHeader"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemainingHeader"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/BlogCategory"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/public/blog/categories/{category}/posts:
    get:
      tags: [Public, Blog]
      summary: Get published posts by category slug
      description: |
        Returns a paginated list of published blog posts belonging to the specified category slug.
        - **Input Requirements**:
          - `category` (required path string): Non-empty category slug or identifier (`1..100` characters).
          - `page` (optional query integer): Must be a positive integer (`>= 1`). Defaults to `1`.
          - `per_page` (optional query integer): Must be an integer between `1` and `50`. Defaults to `20`.
        - **Caching**: Cached in Redis under group `public` (`blog_posts:{category}:{page}:{perPage}`, 600s TTL for `page <= 10`; HTTP response cached 300s).
        - **Rate Limiting**: Enforced per client IP via `RateLimitMiddleware('public:ip')`.
      operationId: publicGetBlogPostsByCategory
      parameters:
        - $ref: "#/components/parameters/PublicBlogCategorySlug"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PublicPerPage"
      responses:
        "200":
          description: Paginated posts in category
          headers:
            X-Cache:
              $ref: "#/components/headers/XCacheHeader"
            Cache-Control:
              $ref: "#/components/headers/PublicCacheControlHeader"
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimitHeader"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemainingHeader"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          posts:
                            type: array
                            items:
                              $ref: "#/components/schemas/BlogPost"
                        required: [posts]
                  - $ref: "#/components/schemas/WithPagination"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/public/exam-results/{token}:
    get:
      tags: [Public, Exams]
      summary: View shared exam result by token (unauthenticated parent view)
      description: |
        Returns a student's exam result breakdown, average percentage, and teacher/staff comments
        for a valid, unrevoked, non-expired share token.
        - **Security & Privacy**:
          - Only SHA-256 (`token_hash`) is stored in PostgreSQL (`exam_result_links`), with a 14-day TTL.
          - Response excludes `national_id` and `phone`.
          - Exempt from `PublicCacheMiddleware`; emits `Cache-Control: no-store, no-cache, must-revalidate` and `X-Robots-Tag: noindex, nofollow`.
          - Stricter IP rate limit (`20` requests per `60` seconds).
          - Invalid, expired, or revoked tokens always return an identical `404 NOT_FOUND` response.
      operationId: publicGetSharedExamResult
      parameters:
        - name: token
          in: path
          required: true
          description: 43-character base64url token generated from `random_bytes(32)`
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{32,64}$"
      responses:
        "200":
          description: Shared exam result details (privacy-safe)
          headers:
            Cache-Control:
              description: Prevents caching of sensitive exam results
              schema:
                type: string
                example: "no-store, no-cache, must-revalidate"
            X-Robots-Tag:
              description: Prevents search engine indexing of shared links
              schema:
                type: string
                example: "noindex, nofollow"
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimitHeader"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemainingHeader"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/PublicSharedExamResult"
        "404":
          description: Uniform 404 for invalid, expired, or revoked token
          headers:
            Cache-Control:
              schema:
                type: string
                example: "no-store, no-cache, must-revalidate"
            X-Robots-Tag:
              schema:
                type: string
                example: "noindex, nofollow"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                data: null
                pagination: null
                error:
                  code: NOT_FOUND
                  message: لینک نتیجه آزمون معتبر نیست یا منقضی شده است
        "429":
          $ref: "#/components/responses/RateLimited"

