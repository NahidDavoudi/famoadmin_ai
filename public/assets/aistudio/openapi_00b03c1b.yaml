      summary: List weekly appointment reminder SMS logs (admin only)
      operationId: appointmentSmsLog
      security:
        - bearerAuth: []
      parameters:
        - name: week_date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Filter by week (normalized via IranDay::weekStart)
        - name: student_id
