openapi: "3.1.0"
info:
  title: Famo Unified API
  description: |
    REST API for Famo Academy — unified backend serving admin panel, public site,
    dashboard, nobat booking, and planner applications.
  version: "1.0.0"
  contact:
    name: Famo Academy
    url: https://famoacademy.ir

servers:
  - url: https://api.famoacademy.ir
    description: Production server

paths:
  # ───────────────────── Health ─────────────────────
  /health:
    get:
      tags: [Health]
      summary: Infrastructure health check (Database & Redis)
      description: Lightweight health endpoint returning live database and Redis connection status for infrastructure monitoring.
      operationId: healthCheckRoot
      responses:
        "200":
          description: Database connection is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        enum: [healthy, degraded, unhealthy]
                        example: healthy
                      database:
                        type: object
                        properties:
                          status:
                            type: string
                            enum: [connected, disconnected]
                            example: connected
                          connected:
                            type: boolean
                            example: true
                          latency_ms:
                            type: number
                            example: 0.42
                        required: [status, connected, latency_ms]
                      redis:
                        type: object
                        properties:
                          status:
                            type: string
                            enum: [connected, disconnected, disabled]
                            example: connected
                          connected:
                            type: boolean
                            example: true
                          latency_ms:
                            type: number
                            example: 0.18
                        required: [status, connected, latency_ms]
                      version:
                        type: string
                        example: 1.0.0
                      time:
                        type: string
                        format: date-time
                        example: "2026-10-31 12:00:00"
                    required: [status, database, redis, version, time]
                required: [success, data, pagination, error]
        "503":
          description: Service unavailable (Database is disconnected)

  /api/v1/health:
    get:
      tags: [Health]
      summary: Health check
      operationId: healthCheck
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        enum: [healthy, degraded, unhealthy]
                        example: healthy
                      database:
                        type: object
                        properties:
                          status:
                            type: string
                            enum: [connected, disconnected]
                            example: connected
                          connected:
                            type: boolean
                            example: true
                          latency_ms:
                            type: number
                            example: 0.42
                        required: [status, connected, latency_ms]
                      redis:
                        type: object
                        properties:
                          status:
                            type: string
                            enum: [connected, disconnected, disabled]
                            example: connected
                          connected:
                            type: boolean
                            example: true
                          latency_ms:
                            type: number
                            example: 0.18
                        required: [status, connected, latency_ms]
                      version:
                        type: string
                        example: 1.0.0
                      time:
                        type: string
                        format: date-time
                        example: "2026-09-23 12:00:00"
                    required: [status, database, redis, version, time]
                required: [success, data, pagination, error]
        "503":
          description: Service unavailable (Database is disconnected)

  # ───────────────────── Auth ─────────────────────
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: نام کاربری
                password:
                  type: string
                  description: رمز عبور
              required: [username, password]
      responses:
        "200":
          description: Login successful (student)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          token:
                            type: string
                          user_id:
                            type: integer
                            description: شناسه کاربر
                          phone_mask:
                            type: string
                            nullable: true
                            description: شماره موبایل ماسک شده (در صورت فعال بودن 2FA)
                          user:
                            type: object
                            properties:
                              id:
                                type: integer
                              username:
                                type: string
                              phone:
                                type: string
                                nullable: true
                              role:
                                type: string
                                enum: [admin, supporter, student, teacher]
                              student_id:
                                type: integer
                                nullable: true
                                description: شناسه دانش‌آموز متصل (فقط برای نقش student)
        "202":
          description: 2FA required (admin/supporter/teacher)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          requires_2fa:
                            type: boolean
                            enum: [true]
                          user_id:
                            type: integer
                            description: شناسه کاربر برای مرحله دوم ورود
                          phone_mask:
                            type: string
                            description: شماره موبایل ماسک شده کاربر
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/auth/verify-2fa:
    post:
      tags: [Auth]
      summary: Verify 2FA code and complete login
      operationId: authVerify2fa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
                  description: شناسه کاربر برگشتی از مرحله اول ورود
                code:
                  type: string
                  description: کد ۶ رقمی ارسال شده از طریق پیامک (SMS)
              required: [user_id, code]
      responses:
        "200":
          description: 2FA verified, login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          token:
                            type: string
                          user:
                            type: object
                            properties:
                              id:
                                type: integer
                              username:
                                type: string
                              role:
                                type: string
                                enum: [admin, supporter, student, teacher]
                              student_id:
                                type: integer
                                nullable: true
                                description: شناسه دانش‌آموز متصل (فقط برای نقش student)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Student self-registration
      operationId: authRegister
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  description: شماره تلفن
                password:
                  type: string
                  format: password
                  minLength: 4
                  description: رمز عبور حساب
                nationalId:
                  type: string
                  description: کد ملی
                grade:
                  type: integer
                  description: پایه تحصیلی
                  enum: [7, 8, 9, 10, 11, 12]
                field:
                  type: string
                  description: رشته تحصیلی
                  enum: [ریاضی, تجربی, انسانی, زبان, هنر, عمومی, راهنمایی]
                name:
                  type: string
                  description: نام و نام خانوادگی
              required: [phone, password, nationalId, grade, field, name]
      responses:
        "201":
          description: Registration successful (returns a JWT — auto login)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          token:
                            type: string
                          user:
                            type: object
                            properties:
                              id:
                                type: integer
                              username:
                                type: string
                              role:
                                type: string
                                enum: [admin, supporter, student, teacher]
                              student_id:
                                type: integer
                                nullable: true
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Get current user from JWT
      operationId: authMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user data
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/AuthUserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/auth/change-password:
    post:
      tags: [Auth]
      summary: Change current user's password
      operationId: authChangePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthChangePasswordRequest"
      responses:
        "200":
          description: Password changed successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: رمز عبور با موفقیت تغییر یافت
                        required: [message]
        "401":
          description: Unauthorized or wrong current password (INVALID_PASSWORD)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                data: null
                pagination: null
                error:
                  code: INVALID_PASSWORD
                  message: رمز عبور فعلی اشتباه است
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/auth/profile:
    put:
      tags: [Auth]
      summary: Update current user's profile (full_name and phone, synced with role table)
      description: >
        Updates `full_name` (or `name`) and `phone` (normalized via `PhoneNumber::normalizeOrFail`)
        in `users` and the linked role table (`admins`, `supporters`, `students`, `instructors`)
        within a transaction. If the previous `username` matched the previous `phone`, `username`
        is also synced to the new `phone`. For 2FA roles (`admin`, `supporter`, `teacher`),
        changing `phone` requires `current_password`.
      operationId: authUpdateProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthProfileUpdateRequest"
      responses:
        "200":
          description: Updated profile data (same structure as /api/v1/auth/me)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/AuthUserProfile"
        "401":
          description: Unauthorized or wrong current password when changing 2FA phone (INVALID_PASSWORD)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                data: null
                pagination: null
                error:
                  code: INVALID_PASSWORD
                  message: رمز عبور فعلی اشتباه است
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Phone number already registered to another user (DUPLICATE_PHONE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                data: null
                pagination: null
                error:
                  code: DUPLICATE_PHONE
                  message: این شماره تلفن قبلاً برای کاربر دیگری ثبت شده است
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Logout (invalidate session)
      operationId: authLogout
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ───────────────────── Telegram Login ─────────────────────
  # Public endpoints (no JWT, no bot service key). The Telegram flow only BINDS
  # an identity; it never grants a site session from `verify`. Tickets travel in
  # the request body only and are single-use. See §4 of the design spec.
  /api/v1/auth/telegram/verify:
    post:
      tags: [Auth]
      summary: Verify Telegram Login Widget payload (never returns a session token)
      description: >
        Offline-verifies the Telegram Login Widget payload with
        HMAC-SHA256 over the alphabetically sorted data-check-string
        (`secret_key = SHA256(bot_token)`); the API never calls Telegram.
        For an already-linked account it returns `linked: true` and the bot
        redirect only. For an unlinked account it returns `linked: false` plus a
        single-use ticket. **This endpoint NEVER returns a session token for any
        role.**
      operationId: telegramVerify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramVerifyRequest"
      responses:
        "200":
          description: >
            Unlinked account (issues a ticket) or already-linked account
            (returns `bot_redirect_url` only). No token is ever returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        oneOf:
                          - $ref: "#/components/schemas/TelegramVerifyUnlinked"
                          - $ref: "#/components/schemas/TelegramVerifyLinked"
        "401":
          $ref: "#/components/responses/TelegramAuthInvalid"
        "409":
          $ref: "#/components/responses/TelegramReplay"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/telegram/register:
    post:
      tags: [Auth]
      summary: Register a new student with a Telegram ticket and link the account
      description: >
        Creates `users` + `students`, inserts the `telegram_links` row
        (`role=student`), atomically consumes the ticket, and returns a JWT.
        Validation is identical to `POST /api/v1/auth/register`.
      operationId: telegramRegister
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramRegisterRequest"
      responses:
        "201":
          description: Registration successful and Telegram account linked (returns a JWT)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/TelegramLinkResult"
        "401":
          $ref: "#/components/responses/TelegramTicketInvalid"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/telegram/link:
    post:
      tags: [Auth]
      summary: Link an existing account using a Telegram ticket
      description: >
        Authenticates `username`/`password` and links the Telegram account.
        Students receive a JWT immediately. Supporters require 2FA: the link row
        is created only after a successful code; the ticket is validated but not
        consumed until `/verify-2fa`. Errors before successful authentication are
        generic (`AUTH_ERROR`).
      operationId: telegramLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramLinkRequest"
      responses:
        "200":
          description: Student linked successfully (returns a JWT)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/TelegramLinkResult"
        "202":
          description: Supporter authenticated — 2FA required (no token, no link yet)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/Telegram2faChallenge"
        "401":
          description: >
            Generic auth failure (`AUTH_ERROR`) or invalid/expired ticket
            (`TELEGRAM_TICKET_INVALID`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                auth_error:
                  value:
                    success: false
                    data: null
                    pagination: null
                    error:
                      code: AUTH_ERROR
                      message: نام کاربری یا رمز عبور اشتباه است
                ticket_invalid:
                  value:
                    success: false
                    data: null
                    pagination: null
                    error:
                      code: TELEGRAM_TICKET_INVALID
                      message: بلیت ورود تلگرام نامعتبر یا منقضی شده است
        "403":
          $ref: "#/components/responses/TelegramLinkRoleUnsupported"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/telegram/verify-2fa:
    post:
      tags: [Auth]
      summary: Verify the Telegram-flow 2FA code and complete linking
      description: >
        Verifies `code` against the server-bound challenge, inserts the
        `role=supporter` link, consumes ticket + challenge, and returns a JWT.
        `user_id` is **not** accepted as authority; if sent it must match the
        server-bound challenge user.
      operationId: telegramVerify2fa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramVerify2faRequest"
      responses:
        "200":
          description: 2FA verified, supporter linked (returns a JWT)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/TelegramLinkResult"
        "401":
          description: >
            Invalid/expired 2FA code (`2FA_ERROR`) or invalid/expired ticket
            (`TELEGRAM_TICKET_INVALID`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                twofa_error:
                  value:
                    success: false
                    data: null
                    pagination: null
                    error:
                      code: 2FA_ERROR
                      message: کد تأیید نامعتبر یا منقضی شده است
                ticket_invalid:
                  value:
                    success: false
                    data: null
                    pagination: null
                    error:
                      code: TELEGRAM_TICKET_INVALID
                      message: بلیت ورود تلگرام نامعتبر یا منقضی شده است
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"

  # ───────────────────── Public ─────────────────────
  /api/v1/public/courses:
    get:
      tags: [Public]
      summary: Get published courses with features
      description: |
        Returns all published courses ordered by `display_order ASC` with their feature strings.
        - **Input Requirements**: None (no query, path, or body parameters required).
        - **Caching**: Cached in Redis under group `public` (`courses` service key, 600s TTL; HTTP response cached 300s via `PublicCacheMiddleware`).
        - **Rate Limiting**: Enforced per client IP via `RateLimitMiddleware('public:ip')`.
      operationId: publicGetCourses
      responses:
        "200":
          description: List of published courses
          headers:
            X-Cache:
              $ref: "#/components/headers/XCacheHeader"
            Cache-Control:
              $ref: "#/components/headers/PublicCacheControlHeader"
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimitHeader"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemainingHeader"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Course"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/public/instructors:
    get:
      tags: [Public]
      summary: Get published instructors with social links
      description: |
        Returns all published instructors ordered by `display_order ASC`, including social links and resolved `image_url`.
        - **Input Requirements**: None (no query, path, or body parameters required).
        - **Caching**: Cached in Redis under group `public` (`instructors` service key, 600s TTL; HTTP response cached 300s via `PublicCacheMiddleware`).
        - **Rate Limiting**: Enforced per client IP via `RateLimitMiddleware('public:ip')`.
      operationId: publicGetInstructors
      responses:
        "200":
          description: List of published instructors
          headers:
            X-Cache:
              $ref: "#/components/headers/XCacheHeader"
            Cache-Control:
              $ref: "#/components/headers/PublicCacheControlHeader"
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimitHeader"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemainingHeader"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Instructor"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/public/supporters:
    get:
      tags: [Public]
      summary: Get public supporters list
      description: |
        Returns all public supporters with `id`, `name`, `grade`, `field`, `avatar`, and resolved `avatar_url`.
        - **Input Requirements**: None (no query, path, or body parameters required).
        - **Caching**: Cached in Redis under group `public` (`supporters` service key, 600s TTL; HTTP response cached 300s via `PublicCacheMiddleware`).
        - **Rate Limiting**: Enforced per client IP via `RateLimitMiddleware('public:ip')`.
      operationId: publicGetSupporters
      responses:
        "200":
          description: List of public supporters
          headers:
            X-Cache:
              $ref: "#/components/headers/XCacheHeader"
            Cache-Control:
              $ref: "#/components/headers/PublicCacheControlHeader"
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimitHeader"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemainingHeader"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/PublicSupporter"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/public/blog/posts:
    get:
      tags: [Public, Blog]
      summary: Get published blog posts (paginated)
      description: |
        Returns a paginated list of published blog posts ordered by `published_at DESC, id DESC`.
        - **Input Requirements**:
          - `page` (optional query integer): Must be a positive integer (`>= 1`). Defaults to `1`.
          - `per_page` (optional query integer): Must be an integer between `1` and `50`. Defaults to `20`.
        - **Caching**: Cached in Redis under group `public` (`blog_posts:0:{page}:{perPage}`, 600s TTL for `page <= 10`; HTTP response cached 300s).
        - **Rate Limiting**: Enforced per client IP via `RateLimitMiddleware('public:ip')`.
      operationId: publicGetBlogPosts
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PublicPerPage"
      responses:
        "200":
          description: Paginated published posts
          headers:
            X-Cache:
              $ref: "#/components/headers/XCacheHeader"
            Cache-Control:
              $ref: "#/components/headers/PublicCacheControlHeader"
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimitHeader"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemainingHeader"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          posts:
                            type: array
                            items:
                              $ref: "#/components/schemas/BlogPost"
                        required: [posts]
                  - $ref: "#/components/schemas/WithPagination"
        "422":
