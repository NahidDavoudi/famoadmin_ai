  /api/v1/appointments/sms/preview:
    get:
      tags: [Appointments]
      summary: Preview weekly appointment reminder SMS status per student (admin only)
      description: |
        Evaluates all active students for the Saturday–Friday week (`IranDay::weekStart(week_date)`) without sending any SMS.
        - Selects active appointments (`status IN ('pending', 'confirmed', 'scheduled')`).
        - If a student has more than one active appointment in the week, selects the nearest (`appointment_date ASC, start_time ASC, id ASC`) and sets `multiple_appointments: true`.
        - Resolves recipient strictly from the student's primary parent contact (`parent_contacts` ordered by `is_primary DESC, id ASC LIMIT 1`), never falling back to the student's own phone.
        - Status per student: `will_send`, `already_sent`, `changed_since_sent`, `failed`, `no_phone`, `no_appointment`.
      operationId: appointmentSmsPreview
      security:
        - bearerAuth: []
      parameters:
        - name: week_date
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Any date within the target Saturday–Friday week (YYYY-MM-DD)
      responses:
        "200":
          description: Weekly appointment SMS preview
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/AppointmentSmsPreviewResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/appointments/sms/send:
    post:
      tags: [Appointments]
      summary: Bulk-send weekly appointment reminder SMS to primary parents via Melipayamak (admin only)
      description: |
        Dispatches weekly appointment reminder SMS via Melipayamak (`MELIPAYAMAK_APPOINTMENT_BODY_ID`) to each eligible student's primary parent (`recipient_type = 'parent'`).
        - Supports `mode`: `unsent` (not yet sent for this week), `failed` (retry failed logs), `changed` (send updated time when `appointment_at` changed after `status=sent`).
        - Each student is processed in an isolated `try/catch` block so one failure does not abort the batch.
        - Protected by a concurrent/double-click lock per `week_date` (`409 CONCURRENT_SEND_LOCKED`) and dedicated rate limits (`appointment_sms:phone` default 3/hr, `appointment_sms:user` default 200/hr).
      operationId: appointmentSmsSend
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentSmsSendRequest"
      responses:
        "200":
          description: Batch SMS dispatch summary and per-student results
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/AppointmentSmsSendResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"

