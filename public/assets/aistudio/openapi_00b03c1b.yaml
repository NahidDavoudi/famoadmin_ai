        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Supporters]
      summary: Delete supporter (admin only)
      operationId: supporterDelete
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Supporter deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  # ───────────────────── Exams ─────────────────────
  /api/v1/exams:
    get:
      tags: [Exams]
      summary: List exam results (filterable, paginated)
      operationId: examGetAll
      security:
        - bearerAuth: []
      parameters:
        - name: student_id
          in: query
          schema:
            type: integer
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
        - $ref: "#/components/parameters/Page"
        - name: per_page
          in: query
          schema:
            type: integer
            default: 200
      responses:
        "200":
          description: Paginated exam results
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          exams:
                            type: array
                            items:
                              $ref: "#/components/schemas/ExamResultListItem"
                  - $ref: "#/components/schemas/WithPagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Exams]
      summary: Bulk save exam results (admin only)
      operationId: examSave
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                student_id:
                  type: integer
                exam_date:
                  type: string
                  format: date
                subjects:
                  type: array
                  items:
                    type: object
                    properties:
                      subject:
                        type: string
                      chapter:
                        type: string
                      total_q:
                        type: integer
                        description: تعداد کل سوالات
                      correct:
                        type: integer
                      wrong:
                        type: integer
                      skipped:
                        type: integer
                    required: [subject, total_q]
              required: [student_id, exam_date, subjects]
      responses:
        "200":
          description: Exam results saved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          inserted:
                            type: integer
                            description: تعداد نتایج ذخیره‌شده
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/exams/dates:
    get:
      tags: [Exams]
      summary: Get distinct exam dates with stats
      operationId: examGetDates
      description: |
        Distinct exam dates with aggregate stats. Students are automatically
        scoped to their own results (a `student_id` different from the token's
        linked student returns 403).
      security:
        - bearerAuth: []
      parameters:
        - name: student_id
          in: query
          required: false
          schema:
            type: integer
          description: محدود کردن به تاریخ‌های یک دانش‌آموز (برای شاگرد خودکار تحمیل می‌شود)
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Exam dates
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          dates:
                            type: array
                            items:
                              type: object
                              properties:
                                exam_date:
                                  type: string
                                  format: date
                                student_count:
                                  type: integer
                                subject_count:
                                  type: integer
                                avg_percentage:
                                  type: number
                  - $ref: "#/components/schemas/WithPagination"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/exams/students:
    get:
      tags: [Exams]
      summary: Get students for a specific exam date (supporter+)
      operationId: examGetStudents
      description: Staff-only listing of all students who took an exam on a date.
      security:
        - bearerAuth: []
      parameters:
        - name: exam_date
          in: query
          required: true
          schema:
            type: string
            format: date
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Students for exam date
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          students:
                            type: array
                            items:
                              type: object
                              properties:
                                student_id:
                                  type: integer
                                name:
                                  type: string
                                grade:
                                  type: integer
                                field:
                                  type: string
                                subject_count:
                                  type: integer
                                avg_percentage:
                                  type: number
                  - $ref: "#/components/schemas/WithPagination"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/exams/details:
    get:
      tags: [Exams]
      summary: Get per-subject breakdown for a student on a date
      operationId: examGetDetails
      description: |
        Per-subject breakdown for one student on one exam date. Students may
        only query their own `student_id` (otherwise 403); staff can query any.
      security:
        - bearerAuth: []
      parameters:
        - name: exam_date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: student_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Exam subject breakdown
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          student:
                            type: object
                            properties:
                              id:
                                type: integer
                              name:
                                type: string
                              grade:
                                type: integer
                              field:
                                type: string
                          subjects:
                            type: array
                            items:
                              type: object
                              properties:
                                subject:
                                  type: string
                                chapter:
                                  type: string
                                  nullable: true
                                total_q:
                                  type: integer
                                correct:
                                  type: integer
                                wrong:
                                  type: integer
                                skipped:
                                  type: integer
                                percentage:
                                  type: number
                          avg_percentage:
                            type: number
                          comments:
                            type: array
                            description: نظرات ثبت‌شده توسط اساتید/کادر آموزشی برای این دانش‌آموز در این آزمون
                            items:
                              $ref: "#/components/schemas/ExamComment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/exams/comments:
    put:
      tags: [Exams]
      summary: Upsert a teacher/staff comment on a student's exam result
      description: >
        Creates or updates a comment for `(student_id, exam_date, teacher_user_id)`
        using PostgreSQL `ON CONFLICT (student_id, exam_date, teacher_user_id) DO UPDATE`.
        Accessible by `teacher`, `supporter`, and `admin` roles.
      operationId: examUpsertComment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExamCommentUpsertRequest"
      responses:
        "200":
          description: Comment upserted successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          comment:
                            $ref: "#/components/schemas/ExamComment"
                          comments:
                            type: array
                            items:
                              $ref: "#/components/schemas/ExamComment"
                        required: [comment, comments]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/exams/share-links:
    get:
      tags: [Exams]
      summary: List shareable exam result links for panel management (supporter/admin)
      description: >
        Returns shareable exam result links (filtered by optional `student_id` and `exam_date`)
        including `status` (`active`, `expired`, `revoked`), `sms_sent_at`, and `last_viewed_at`.
        Never exposes `token_hash`.
      operationId: examListShareLinks
      security:
        - bearerAuth: []
      parameters:
        - name: student_id
          in: query
          required: false
          schema:
            type: integer
        - name: exam_date
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: List of exam result share links
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          links:
                            type: array
                            items:
                              $ref: "#/components/schemas/ExamShareLinkItem"
                        required: [links]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [Exams]
      summary: Generate a 14-day shareable parent link for a student's exam result with optional Melipayamak SMS dispatch (supporter/admin)
      description: >
        Generates a base64url token from `random_bytes(32)`, stores only its `SHA-256` hash
        in PostgreSQL (`exam_result_links`) with a 14-day expiration (`expires_at`), and optionally
        dispatches the link via Melipayamak pattern SMS when `send_sms: true` is passed (enforcing
        per-phone, per-IP, and cooldown rate limits). Accessible by `supporter` and `admin`.
      operationId: examCreateShareLink
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExamShareLinkCreateRequest"
      responses:
        "201":
          description: Shareable link created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/ExamShareLinkResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/exams/share-links/send-sms:
    post:
      tags: [Exams]
      summary: Generate a 14-day share link and dispatch it to parent via Melipayamak SMS (supporter/admin)
      description: >
        Generates a fresh 14-day shareable exam result link, resolves the parent mobile number
        (from explicit `phone`, `parent_contact_id`, or primary `parent_contacts` record), enforces
        rate limits (`exam_sms:cooldown`, `exam_sms:phone`, `exam_sms:ip`), dispatches the link
        through Melipayamak (`BaseServiceNumber`), and records `sms_sent_at`.
      operationId: examSendShareLinkSms
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExamShareLinkCreateRequest"
      responses:
        "201":
          description: Shareable link created and SMS dispatched
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/ExamShareLinkResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/exams/share-links/{id}:
    delete:
      tags: [Exams]
      summary: Revoke an exam result share link (supporter/admin)
      description: Sets `revoked_at = CURRENT_TIMESTAMP` so the public token immediately returns 404.
      operationId: examRevokeShareLink
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Share link revoked
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          link:
                            $ref: "#/components/schemas/ExamShareLinkItem"
                        required: [link]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/exams/share-links/{id}/revoke:
    post:
      tags: [Exams]
      summary: Revoke an exam result share link via POST (supporter/admin)
      operationId: examRevokeShareLinkPost
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Share link revoked
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          link:
                            $ref: "#/components/schemas/ExamShareLinkItem"
                        required: [link]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ───────────────────── Weekly Plans ─────────────────────
  /api/v1/plans:
    get:
      tags: [WeeklyPlans]
      summary: List a student's weekly plans (admin)
      description: Temporary admin-only while the planner is migrated.
      operationId: planList
      security:
        - bearerAuth: []
      parameters:
        - name: student_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Plan summaries for the student
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          plans:
                            type: array
                            items:
                              $ref: "#/components/schemas/WeeklyPlanSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [WeeklyPlans]
      summary: Create a full weekly plan (admin)
      description: >-
        Resolves the student from student_id / national_id / name+grade,
        creating one when missing, then stores the week date, notes, time
        slots and events. Each event may carry one or more topics.
        When no plan id is given and a plan already exists for the same
        student + week date, it is updated instead of duplicated.
      operationId: planSave
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanSaveRequest"
      responses:
        "201":
          description: Plan saved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/PlanSaveResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [WeeklyPlans]
      summary: Clear every plan of a student (admin)
      operationId: planClear
      security:
        - bearerAuth: []
      parameters:
        - name: student_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Plans cleared
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          deleted:
                            type: integer
                          student_id:
                            type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/plans/{id}:
