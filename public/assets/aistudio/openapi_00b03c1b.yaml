  # ───────────────────── Subscriptions ─────────────────────
  /api/v1/subscriptions:
    get:
      tags: [Subscriptions]
      summary: List course subscriptions (paginated & filterable)
      description: |
        Returns a paginated list of course subscriptions joined with `course` and `student` details.
        - **Admin / Supporter**: Can list all subscriptions and filter by `student_id`, `course_id`, `status`, `is_active`, and `search`.
        - **Student**: Automatically scoped to their own `student_id` via `StudentScope`.
      operationId: subscriptionList
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: student_id
          in: query
          schema:
            type: integer
          description: فیلتر بر اساس شناسه دانش‌آموز (برای نقش student به صورت خودکار روی خودش قفل می‌شود)
        - name: course_id
          in: query
          schema:
            type: integer
          description: فیلتر بر اساس شناسه دوره
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, active, expired, cancelled, rejected]
          description: فیلتر بر اساس وضعیت اشتراک
        - name: is_active
          in: query
          schema:
            type: integer
            enum: [0, 1]
          description: فیلتر بر اساس فعال بودن (0 یا 1)
        - name: search
          in: query
          schema:
            type: string
          description: جستجو در نام دانش‌آموز، شماره موبایل، نام دوره یا یادداشت
      responses:
        "200":
          description: Paginated list of subscriptions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Subscription"
                  - $ref: "#/components/schemas/WithPagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Subscriptions]
      summary: Create a course subscription
      description: |
        Creates a new course subscription.
        - **Student**: Subscribes themselves (`student_id` is resolved from JWT) with `status: "pending"`.
        - **Admin / Supporter**: Must provide `student_id` and `course_id`, and can optionally set `status`, `is_active`, `started_at`, `end_at`, and `note`.
        - Rejects duplicate active or pending subscriptions for the same `(student_id, course_id)` with `409 ALREADY_SUBSCRIBED`.
      operationId: subscriptionCreate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionCreateRequest"
      responses:
        "201":
          description: Subscription created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/Subscription"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Active or pending subscription already exists for this student and course (`ALREADY_SUBSCRIBED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                data: null
                pagination: null
                error:
                  code: ALREADY_SUBSCRIBED
                  message: این دانش‌آموز در حال حاضر اشتراک فعال یا در انتظار تایید برای این دوره دارد
        "422":
          $ref: "#/components/responses/ValidationError"

