          $ref: "#/components/responses/ValidationError"

  /api/v1/supporters/{id}:
    get:
      tags: [Supporters]
      summary: Get single supporter
      operationId: supporterGet
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Supporter found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/Supporter"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Supporters]
      summary: Update supporter (admin only)
      operationId: supporterUpdate
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                grade:
                  type: integer
                  enum: [7, 8, 9, 10, 11, 12]
                field:
                  type: string
                phone:
