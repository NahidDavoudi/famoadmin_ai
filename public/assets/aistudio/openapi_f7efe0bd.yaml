openapi: "3.1.0"
info:
  title: FAMO API — Public Endpoints Specification
  version: "1.0.0"
  description: |
    OpenAPI 3.1.0 specification for all public (unauthenticated) endpoints of the FAMO Academy REST API.

    ### Architecture & Middleware Guarantees
    1. **Redis Caching (`PublicCacheMiddleware` & `Cache`)**:
       - All `GET /api/v1/public/*` endpoints cache service-layer data (600s TTL) and HTTP JSON responses (300s TTL) in Redis under the `public` cache group (`Cache-Control: public, max-age=300`, `Vary: Origin`, `X-Cache: HIT|MISS`).
       - `GET /api/v1/public/blog/posts/{slug}` caches the post record in Redis (`blog_post:{slug}`) while atomically incrementing live post views in Redis (`blog_post_views:{id}`) and the database.
       - Admin mutations on courses, instructors, supporters, or blog posts call `Cache::flushGroup('public')` to invalidate the group.
    2. **Redis Rate Limiting (`RateLimitMiddleware` & `RateLimiter`)**:
       - All `/api/v1/public/*` endpoints enforce per-IP rate limiting via Redis (`rl:attempts:public:ip:{sha256(ip)}` and `rl:lock:public:ip:{sha256(ip)}`), configurable via `PUBLIC_RATE_LIMIT_MAX_ATTEMPTS` (default `60`), `PUBLIC_RATE_LIMIT_WINDOW_SECONDS` (default `60`), and `PUBLIC_RATE_LIMIT_LOCKOUT_SECONDS` (default `60`).
       - Responses include `X-RateLimit-Limit` and `X-RateLimit-Remaining` headers, and return `429 Too Many Requests` (`RATE_LIMITED`) with `Retry-After` when exceeded.
    3. **Input Validation (`RequestValidationMiddleware` & `Validator`)**:
       - Query and path parameters on public blog endpoints are validated for type, range, and length (`422 VALIDATION_ERROR`).
       - Public authentication and registration `POST` endpoints require a valid JSON object body (`Content-Type: application/json`) and validate all mandatory fields and formats.
  contact:
    name: Famo Academy
    url: https://famoacademy.ir

servers:
  - url: https://api.famoacademy.ir
    description: Production server
  - url: http://localhost:3000
    description: Local development server

tags:
  - name: Public
    description: Public site endpoints for courses, instructors, supporters, and blog
  - name: Blog
    description: Public blog posts and categories
  - name: Health
    description: Public service health check
  - name: Auth
    description: Public authentication, registration, 2FA, and Telegram Login Widget handoff

paths:
  /api/v1/health:
    get:
      tags: [Health, Public]
      summary: Health check
      description: Verifies API liveness and returns current server status, version, and timestamp. Requires no input parameters.
      operationId: healthCheck
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status:
                            type: string
                            example: healthy
                          version:
                            type: string
                            example: "1.0.0"
                          time:
                            type: string
                            format: date-time
                            example: "2026-10-31 12:00:00"
                        required: [status, version, time]

  /api/v1/public/courses:
    get:
      tags: [Public]
      summary: Get published courses with features
      description: |
        Returns all published courses ordered by `display_order ASC` along with their feature list.
        - **Input Requirements**: None (no query, path, or body parameters required).
      operationId: publicGetCourses
      responses:
        "200":
          description: List of published courses
          headers:
            X-Cache:
              $ref: "#/components/headers/XCacheHeader"
            Cache-Control:
              $ref: "#/components/headers/PublicCacheControlHeader"
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimitHeader"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemainingHeader"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Course"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/public/instructors:
    get:
      tags: [Public]
      summary: Get published instructors with social links
      description: |
        Returns all published instructors ordered by `display_order ASC` with social links and hydrated `image_url`.
        - **Input Requirements**: None (no query, path, or body parameters required).
      operationId: publicGetInstructors
      responses:
        "200":
          description: List of published instructors
          headers:
            X-Cache:
              $ref: "#/components/headers/XCacheHeader"
            Cache-Control:
              $ref: "#/components/headers/PublicCacheControlHeader"
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimitHeader"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemainingHeader"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Instructor"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/public/supporters:
    get:
      tags: [Public]
      summary: Get public supporters list
      description: |
        Returns all public supporters with `id`, `name`, `grade`, `field`, `avatar`, and resolved `avatar_url`.
        - **Input Requirements**: None (no query, path, or body parameters required).
      operationId: publicGetSupporters
      responses:
        "200":
          description: List of public supporters
          headers:
            X-Cache:
              $ref: "#/components/headers/XCacheHeader"
            Cache-Control:
              $ref: "#/components/headers/PublicCacheControlHeader"
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimitHeader"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemainingHeader"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/PublicSupporter"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/public/blog/posts:
    get:
      tags: [Public, Blog]
      summary: Get published blog posts (paginated)
      description: |
        Returns a paginated list of published blog posts ordered by `published_at DESC, id DESC`.
        - **Input Requirements**:
          - `page` (optional query integer): Positive integer (`>= 1`, default `1`).
          - `per_page` (optional query integer): Integer between `1` and `50` (default `20`).
      operationId: publicGetBlogPosts
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PublicPerPage"
      responses:
        "200":
          description: Paginated published blog posts
          headers:
            X-Cache:
              $ref: "#/components/headers/XCacheHeader"
            Cache-Control:
              $ref: "#/components/headers/PublicCacheControlHeader"
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimitHeader"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemainingHeader"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          posts:
                            type: array
                            items:
                              $ref: "#/components/schemas/BlogPost"
                        required: [posts]
                      pagination:
                        $ref: "#/components/schemas/Pagination"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/public/blog/posts/{slug}:
    get:
      tags: [Public, Blog]
      summary: Get single published blog post by slug
      description: |
        Returns a single published blog post matching `slug` and increments its view count.
        - **Input Requirements**:
          - `slug` (required path string): Non-empty URL slug (`1..255` characters).
      operationId: publicGetBlogPostBySlug
      parameters:
        - $ref: "#/components/parameters/PublicBlogSlug"
      responses:
        "200":
          description: Blog post found
          headers:
            Cache-Control:
              $ref: "#/components/headers/PublicCacheControlHeader"
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimitHeader"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemainingHeader"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          post:
                            $ref: "#/components/schemas/BlogPost"
                        required: [post]
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/public/blog/categories:
    get:
      tags: [Public, Blog]
      summary: Get active blog categories
      description: |
        Returns all active blog categories with their published post counts.
        - **Input Requirements**: None (no query, path, or body parameters required).
      operationId: publicGetBlogCategories
      responses:
        "200":
          description: List of blog categories
          headers:
            X-Cache:
              $ref: "#/components/headers/XCacheHeader"
            Cache-Control:
              $ref: "#/components/headers/PublicCacheControlHeader"
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimitHeader"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemainingHeader"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/BlogCategory"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/public/blog/categories/{category}/posts:
    get:
      tags: [Public, Blog]
      summary: Get published blog posts by category slug
      description: |
        Returns a paginated list of published blog posts in the specified category.
        - **Input Requirements**:
          - `category` (required path string): Non-empty category slug (`1..100` characters).
          - `page` (optional query integer): Positive integer (`>= 1`, default `1`).
          - `per_page` (optional query integer): Integer between `1` and `50` (default `20`).
      operationId: publicGetBlogPostsByCategory
      parameters:
        - $ref: "#/components/parameters/PublicBlogCategorySlug"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PublicPerPage"
      responses:
        "200":
          description: Paginated posts in category
          headers:
            X-Cache:
              $ref: "#/components/headers/XCacheHeader"
            Cache-Control:
              $ref: "#/components/headers/PublicCacheControlHeader"
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimitHeader"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemainingHeader"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          posts:
                            type: array
                            items:
                              $ref: "#/components/schemas/BlogPost"
                        required: [posts]
                      pagination:
                        $ref: "#/components/schemas/Pagination"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Authenticate user with username and password
      description: |
        Public login endpoint. Validates that `username` and `password` are non-empty strings.
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  minLength: 1
                  description: نام کاربری (الزامی)
                password:
                  type: string
                  format: password
                  minLength: 1
                  description: رمز عبور (الزامی)
              required: [username, password]
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "202":
          description: 2FA verification required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Student self-registration
      description: |
        Public student registration endpoint with strict server-side input validation:
        - `phone`: Iranian mobile format (`09XXXXXXXXX`)
        - `password`: String with minimum length of 4 characters
        - `nationalId`: 10-digit Iranian National ID passing checksum validation
        - `grade`: Integer in `[7, 8, 9, 10, 11, 12]`
        - `field`: String in `[ریاضی, تجربی, انسانی, زبان, هنر, عمومی, راهنمایی]`
        - `name`: Full name string (`2..150` characters)
      operationId: authRegister
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  pattern: '^(\+98|0098|98|0)?9[0-9]{9}$'
                password:
                  type: string
                  format: password
                  minLength: 4
                nationalId:
                  type: string
                  pattern: '^[0-9]{10}$'
                  minLength: 10
                  maxLength: 10
                grade:
                  type: integer
                  enum: [7, 8, 9, 10, 11, 12]
                field:
                  type: string
                  enum: [ریاضی, تجربی, انسانی, زبان, هنر, عمومی, راهنمایی]
                name:
                  type: string
                  minLength: 2
                  maxLength: 150
              required: [phone, password, nationalId, grade, field, name]
      responses:
        "201":
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/auth/verify-2fa:
    post:
      tags: [Auth]
      summary: Verify 2FA code
      description: Public endpoint to complete two-factor authentication. Requires positive integer `user_id` and non-empty `code`.
      operationId: authVerify2fa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
                  minimum: 1
                code:
                  type: string
                  minLength: 1
              required: [user_id, code]
      responses:
        "200":
          description: 2FA verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Clear authentication cookie
      description: Public endpoint that clears the shared auth cookie. Request body is optional.
      operationId: authLogout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

components:
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 1
        minimum: 1
      description: Page number (positive integer >= 1)
    PublicPerPage:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 50
      description: Number of items per page (integer between 1 and 50; default 20)
    PublicBlogSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
      description: Non-empty URL slug of the published blog post (1..255 characters)
    PublicBlogCategorySlug:
      name: category
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
      description: Non-empty blog category slug (1..100 characters)

  headers:
    XCacheHeader:
      description: Redis cache status (`HIT` when served from Redis cache, `MISS` when computed fresh)
      schema:
        type: string
        enum: [HIT, MISS]
    PublicCacheControlHeader:
      description: HTTP cache control header (`public, max-age=300`)
      schema:
        type: string
        example: "public, max-age=300"
    XRateLimitLimitHeader:
      description: Maximum allowed requests per window for the client IP (`PUBLIC_RATE_LIMIT_MAX_ATTEMPTS`, default 60)
      schema:
        type: integer
        example: 60
    XRateLimitRemainingHeader:
      description: Remaining allowed requests in the current window
      schema:
        type: integer
        minimum: 0
        example: 59

  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          nullable: true
        pagination:
          anyOf:
            - $ref: "#/components/schemas/Pagination"
            - type: "null"
        error:
          type: "null"
      required: [success, data, pagination, error]

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [false]
        data:
          type: "null"
        pagination:
          type: "null"
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required: [code, message]
      required: [success, data, pagination, error]

    Pagination:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
          maximum: 50
        total:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
      required: [page, per_page, total, total_pages]

    Course:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        icon:
          type: string
          nullable: true
        gradient_color_from:
          type: string
          nullable: true
        gradient_color_to:
          type: string
          nullable: true
        background_image_url:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        full_description:
          type: string
          nullable: true
        target_grades:
          type: string
          nullable: true
        format:
          type: string
          nullable: true
        badge_label:
          type: string
          nullable: true
        price:
          type: integer
        display_order:
          type: integer
        features:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time

    Instructor:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        full_bio:
          type: string
          nullable: true
        image_url:
          type: string
          nullable: true
        initial_letter:
          type: string
          nullable: true
        display_order:
          type: integer
        social_links:
          type: array
          items:
            type: object
            properties:
              platform:
                type: string
              url:
                type: string
        created_at:
          type: string
          format: date-time

    PublicSupporter:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        grade:
          type: integer
          nullable: true
        field:
          type: string
          nullable: true
        avatar:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
      required: [id, name, avatar_url]

    BlogCategory:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        icon:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        sort_order:
          type: integer
        post_count:
          type: integer

    BlogPost:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        excerpt:
          type: string
          nullable: true
        content:
          type: string
        cover_image:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        category_id:
          type: integer
          nullable: true
        published:
          type: boolean
        published_at:
          type: string
          format: date-time
          nullable: true
        views:
          type: integer
        meta_description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Input validation failed (`422 Unprocessable Entity`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            data: null
            pagination: null
            error:
              code: VALIDATION_ERROR
              message: شماره صفحه باید یک عدد صحیح مثبت باشد
    RateLimited:
      description: Too many requests (`429 Too Many Requests`)
      headers:
        Retry-After:
          description: Seconds until the rate-limit lockout expires
          schema:
            type: integer
        X-RateLimit-Limit:
          $ref: "#/components/headers/XRateLimitLimitHeader"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/XRateLimitRemainingHeader"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            data: null
            pagination: null
            error:
              code: RATE_LIMITED
              message: تعداد درخواست‌ها بیش از حد مجاز است
